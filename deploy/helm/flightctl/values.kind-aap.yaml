# PoC snapshot of the current local kind + AAP demo configuration.
# Apply this over the existing development Helm release with --reuse-values.
global:
  # Current host IP used by the Flightctl kind routes.
  baseDomain: "192.168.1.174.nip.io"
  auth:
    type: aap
    # The AAP demo endpoint currently presents a self-signed certificate.
    insecureSkipTlsVerify: true
    aap:
      apiUrl: "https://aap-aap-operator.apps.127.0.0.1.nip.io"
      hostAliases:
        - ip: "192.168.1.174"
          hostnames:
            - "aap-aap-operator.apps.127.0.0.1.nip.io"
      authorizationUrl: "https://aap-aap-operator.apps.127.0.0.1.nip.io/o/authorize/"
      tokenUrl: "https://aap-aap-operator.apps.127.0.0.1.nip.io/o/token/"
      clientId: "LzQvCACgrmcQSI39M3L95PkFXHPgC41IGyxvQ7Cs"
      enabled: true

# 1. Start the CRC cluster (requires that no device is using port 2222), then wait
# for aap-operator to bring its pods up:
# crc start

# 2. Modify the Auth provider to use AAP instead of k8s:
# helm dependency build ./deploy/helm/flightctl
# helm upgrade flightctl ./deploy/helm/flightctl \
#   --namespace flightctl-external \
#   --reuse-values \
#   --values ./deploy/helm/flightctl/values.kind-aap.yaml \
#   --kube-context kind-kind

# 3. Set context
# kubectl config use-context kind-kind

# 4. Restart the API so it reloads the updated config:
# kubectl rollout restart deployment/flightctl-api -n flightctl-external

# 5. Login via the CLI using the URL that has the API certificate:
# flightctl login https://api.192.168.1.174.nip.io:3443 --web

# 6. UPdate the orgId in the PoC file so the user does not get rejected.

